name = "frontend-api-auth"
main = "src/workers/auth.ts"
compatibility_date = "2026-08-17"
compatibility_flags = ["nodejs_compat"]

[env.uat]
name = "frontend-api-auth-uat"
routes = [
  { pattern = "console-uat.onwalk.net/api/auth/*", zone_name = "onwalk.net" },
  { pattern = "console-uat.onwalk.net/api/v1/auth/*", zone_name = "onwalk.net" }
]

[env.uat.vars]
PRIMARY_UPSTREAM = "https://vps-api.svc.plus"
FALLBACK_UPSTREAM = "https://accounts-service-uc.a.run.app"
JWT_ISSUER = "https://accounts.svc.plus"
TIMEOUT_MS = "2500"
